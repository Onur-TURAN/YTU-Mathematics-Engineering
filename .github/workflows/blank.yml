# ======================================================
# 📘 Academic Notes Publishing Workflow
# Converts LaTeX -> QMD -> HTML and publishes to gh-pages
# ======================================================

name: Academic CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  schedule:
    - cron: '0 6 * * *' # Her gün sabah 06:00'da çalışır
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # 1️⃣ Repo'yu al
      - name: Checkout this repository
        uses: actions/checkout@v4

      # 2️⃣ Python ortamı hazırla (dönüşüm script'i için)
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # 3️⃣ Quarto kur
      - name: Setup Quarto
        uses: quarto-dev/quarto-actions/setup@v2

      # 4️⃣ Gerekli kütüphaneleri yükle
      - name: Install dependencies
        run: |
          pip install pandoc

      # 5️⃣ LaTeX -> QMD dönüşümü
      - name: Convert LaTeX to QMD
        run: |
          echo "🧮 Converting .tex files to .qmd..."
          mkdir -p qmd
          for f in $(find . -name '*.tex'); do
            base=$(basename "$f" .tex)
            pandoc "$f" -o "qmd/${base}.qmd"
          done
          echo "✅ Conversion complete."

      # 6️⃣ Quarto render (QMD -> HTML)
      - name: Render Quarto project
        run: |
          echo "🧱 Rendering Quarto project..."
          quarto render qmd --to html
          echo "✅ Render complete."

      # 7️⃣ Diğer repoya (turanonur.git / gh-pages) aktar
      - name: Publish to turanonur.git
        uses: peaceiris/actions-gh-pages@v3
        with:
          personal_token: ${{ secrets.turanonur }}
          external_repository: Onur-TURAN/turanonur
          publish_branch: gh-pages
          publish_dir: qmd
          destination_dir: academic/notes

      # 8️⃣ Hatalı dönüşümler varsa issue aç
      - name: Check for conversion issues
        run: |
          echo "🔍 Checking for conversion errors..."
          errors=$(grep -R "Undefined control sequence" qmd || true)
          if [ ! -z "$errors" ]; then
            echo "⚠️ Errors found:"
            echo "$errors"
            echo "::set-output name=has_errors::true"
          else
            echo "::set-output name=has_errors::false"
          fi
        id: check_errors

      - name: Create issue for conversion errors
        if: steps.check_errors.outputs.has_errors == 'true'
        uses: peter-evans/create-issue-from-file@v5
        with:
          title: "LaTeX → QMD Dönüşüm Hataları (Günlük Rapor)"
          content-filepath: qmd/conversion_errors.txt
          token: ${{ secrets.GITHUB_TOKEN }}


      # 🔹 Eski örnek adımlar (senin orijinal CI kısmın)
      - name: Run a one-line script
        run: echo "Hello, world!"

      - name: Run a multi-line script
        run: |
          echo "Add other actions to build,"
          echo "test, and deploy your project."
